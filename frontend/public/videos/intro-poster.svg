<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Self-introduction video">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9CFB8"/>
      <stop offset="55%" stop-color="#C9BC9F"/>
      <stop offset="100%" stop-color="#A89777"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="45%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2A2418" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>

  <!-- halftone dot field, the way an old newspaper reproduces a photograph -->
  <g fill="#2A2418" opacity="0.13">
    <circle cx="140" cy="120" r="3.2"/><circle cx="330" cy="200" r="2.4"/>
    <circle cx="540" cy="95"  r="2.8"/><circle cx="760" cy="175" r="2.1"/>
    <circle cx="980" cy="110" r="3.0"/><circle cx="1200" cy="195" r="2.5"/>
    <circle cx="1420" cy="130" r="2.9"/><circle cx="230" cy="390" r="2.3"/>
    <circle cx="450" cy="470" r="2.9"/><circle cx="690" cy="405" r="2.0"/>
    <circle cx="920" cy="500" r="2.7"/><circle cx="1150" cy="420" r="2.4"/>
    <circle cx="1370" cy="505" r="2.9"/><circle cx="160" cy="700" r="2.6"/>
    <circle cx="390" cy="780" r="2.2"/><circle cx="640" cy="695" r="3.0"/>
    <circle cx="880" cy="795" r="2.3"/><circle cx="1110" cy="710" r="2.8"/>
    <circle cx="1340" cy="785" r="2.4"/><circle cx="1520" cy="640" r="2.6"/>
  </g>

  <circle cx="800" cy="392" r="78" fill="none" stroke="#2A2418" stroke-opacity="0.5" stroke-width="4"/>
  <path d="M778 356 L778 428 L838 392 Z" fill="#2A2418" fill-opacity="0.62"/>

  <text x="800" y="556" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="46" letter-spacing="10" fill="#2A2418" fill-opacity="0.75">
    SELF-INTRODUCTION
  </text>
  <text x="800" y="606" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" letter-spacing="6" fill="#2A2418" fill-opacity="0.5">
    THE SAGHANA CHRONICLE
  </text>

  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>